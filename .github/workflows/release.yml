name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Run GitVersion
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v3
        with:
          disableCache: true

      - name: Display calculated version
        run: |
          echo "GitVersion calculated SemVer: ${{ steps.gitversion.outputs.semVer }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger "console"

      - name: Publish (Windows)
        run: |
          dotnet publish src/GreeterCli.App/GreeterCli.App.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            --output ./publish/win

      - name: Publish (Linux)
        run: |
          dotnet publish src/GreeterCli.App/GreeterCli.App.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            --output ./publish/linux

      - name: Prepare release assets (stable names)
        run: |
          mkdir -p ./publish/assets
          mv ./publish/win/greeter.exe ./publish/assets/greeter.exe
          mv ./publish/linux/greeter ./publish/assets/greeter
          chmod +x ./publish/assets/greeter

      - name: Create and push tag (skip if exists)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch --tags

          TAG="v${{ steps.gitversion.outputs.semVer }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping tag creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          files: |
            ./publish/assets/greeter.exe
            ./publish/assets/greeter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
